<ng-container *transloco="let t">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-title>{{ t('app.title') }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true">
    <ion-header collapse="condense">
      <ion-toolbar>
        <ion-title size="large">{{ t('app.title') }}</ion-title>
      </ion-toolbar>
    </ion-header>

    <div id="container">
      <p>{{ t('cardList.empty') }}</p>
    </div>
  </ion-content>
</ng-container>
